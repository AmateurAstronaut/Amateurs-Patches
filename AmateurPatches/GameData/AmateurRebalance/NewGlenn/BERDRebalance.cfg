//Rebelance patch for BERD

//BE4 changes
@PART[BE4]:AFTER[BERD]
{
    @rescaleFactor = 1.0896
    @mass = 1.350
    !MODULE[ModuleEnginesFX] {}
	MODULE
	{
		name = ModuleEnginesFX
		engineID = Archimedes
		runningEffectName = running_closed
		thrustVectorTransformName = thrustTransform
		exhaustDamage = True
		ignitionThreshold = 0.1
		minThrust = 0
		maxThrust = 698.62
		heatProduction = 406.5686307
		fxOffset = 0, 0, 0
		EngineType = LiquidFuel
		exhaustDamageDistanceOffset = 1.5
		PROPELLANT
		{
			name = LqdMethane
			ratio = 3
			DrawGauge = True
		}
		PROPELLANT
		{
			name = Oxidizer
			ratio = 1
		}
		atmosphereCurve
		{
			key = 0 341
			key = 1 305
			key = 12 0.001
		}
	}

    MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = engineSwitch
		switcherDescription = Engine Block Switch
		switchInFlight = False
		SUBTYPE
        {
			name = BE-4
			title = BE-4 Block 1
			descriptionSummary = BE-4 Block 1 flown on the first 2 flights of New Glenn.
			descriptionDetail = <b>Max Thrust</b>: 630.90 kN (ASL), 698.62 kN (Vac) <br><b>Isp</b>: 305 s (ASL), 341 s (Vac) <br><b>Alternator</b>: 3 EC/s 
			primaryColor = White
			secondaryColor = Blue
        }
	    SUBTYPE
		{
			name = BE-4 V2
			title = BE-4 Block 2
			descriptionSummary = BE-4 Block 2 flown on the 3rd flight onwards of New Glenn.
			descriptionDetail = <b>Max Thrust</b>: 701.22 kN (ASL), 780.65 kN (Vac) <br><b>Isp</b>: 302 s (ASL), 337 s (Vac) <br><b>Alternator</b>: 3 EC/s 
			primaryColor = White
			secondaryColor = Purple
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
					engineID = Archimedes
				}
				DATA
				{
					maxThrust = 780.65
					atmosphereCurve
		        	{
			        	key = 0 337
			        	key = 1 302
			        	key = 12 0.001
		        	}
				}
			}
		}
		SUBTYPE
		{
			name = BE-4 V3
			title = BE-4 Block 3
			descriptionSummary = BE-4 Block 3 demonstrated on the test stand but not yet flown.
			descriptionDetail = <b>Max Thrust</b>: 701.22 kN (ASL), 797.34 kN (Vac) <br><b>Isp</b>: 307 s (ASL), 346 s (Vac) <br><b>Alternator</b>: 3 EC/s 
			primaryColor = White
			secondaryColor = Pink
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleEnginesFX
					engineID = Archimedes
				}
				DATA
				{
					maxThrust = 797.34
					atmosphereCurve
		        	{
			        	key = 0 346
			        	key = 1 307
			        	key = 12 0.001
		        	}
				}
			}
		}
	}
	@MODULE[ModuleWaterfallFX]
	{
		@TEMPLATE:HAS[#templateName[be4-lower-1]]
		{
			@scale[*] = 0.74
		}
		@TEMPLATE:HAS[#templateName[waterfall-nozzle-glow-blue-1]]
		{
			@scale[0] = 0.98
			@scale[1] = 0.98
		}
	}
}

